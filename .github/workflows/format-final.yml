name: Format final release branch

on:
  push:
    branches:
      - release/0.11-final

permissions:
  contents: write

concurrency:
  group: format-final-release
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.11-final
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run format
      - name: Commit formatting
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet; then
            echo "Formatting already clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format simplified release"
          git push origin HEAD:release/0.11-final
