name: Publish GitHub release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-github-release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.event.workflow_run.head_sha }}

    steps:
      - name: Check out validated source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -Eeuo pipefail
          VERSION="$(jq -r '.version // empty' package.json)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check existing release
        id: existing
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up build runtime
        if: steps.existing.outputs.exists != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node.js
        if: steps.existing.outputs.exists != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build production runtime
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          bun install --frozen-lockfile
          bun run build
          test -f .output/server/index.mjs

      - name: Build canonical prebuilt archive
        if: steps.existing.outputs.exists != 'true'
        id: archive
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -Eeuo pipefail
          ARCHIVE="wfilemanager-$VERSION.tar.gz"

          # Keep .output at archive depth 1. The production updater intentionally
          # detects .output/server/index.mjs within maxdepth 3 after extraction.
          tar -czf "$ARCHIVE" .output package.json deploy

          # Regression guard: validate the archive with the same discovery rule
          # used by deploy/update.sh before publishing anything to users.
          CHECK_ROOT="$(mktemp -d)"
          trap 'rm -rf "$CHECK_ROOT"' EXIT
          tar -xzf "$ARCHIVE" -C "$CHECK_ROOT"
          PROJECT_DIR="$(find "$CHECK_ROOT" -maxdepth 3 -type f -path '*/.output/server/index.mjs' -printf '%h\n' | sed 's#/.output/server$##' | head -n1)"
          test -n "$PROJECT_DIR"
          test -f "$PROJECT_DIR/.output/server/index.mjs"
          test -f "$PROJECT_DIR/package.json"
          test -f "$PROJECT_DIR/deploy/wfilemanager-reset-admin-password"
          test -f "$PROJECT_DIR/deploy/uninstall.sh"

          SHA256="$(sha256sum "$ARCHIVE" | awk '{print $1}')"
          SIZE="$(stat -c%s "$ARCHIVE")"
          printf '%s  %s\n' "$SHA256" "$ARCHIVE" > SHA256SUMS
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.archive.outputs.sha256 }}
          SIZE: ${{ steps.archive.outputs.size }}
        run: |
          cat > release-notes.md <<EOF
          wFileManager $VERSION is a prebuilt Linux runtime release.

          - Rebuilt React frontend on IBM Carbon Design System.
          - Carbon UI shell, rail navigation, forms, tables, modals, notifications and themes.
          - Single local administrator account and local SQLite data.
          - No server-side Bun install or application compilation.
          - Verified atomic updates with rollback.

          SHA-256: \`$SHA256\`
          Size: \`$SIZE bytes\`
          EOF

      - name: Publish release
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          ARCHIVE: ${{ steps.archive.outputs.archive }}
        run: |
          gh release create "$TAG" "$ARCHIVE#Prebuilt Linux x64 runtime" SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_REF" \
            --title "wFileManager $VERSION" \
            --notes-file release-notes.md \
            --latest

      - name: Sync stable updater channel
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_SYNC_URL: https://igihzeyfgwhnuiflamvn.supabase.co/functions/v1/wfilemanager-release-sync
        run: |
          set -Eeuo pipefail
          curl -fsS --retry 3 -X POST "$RELEASE_SYNC_URL" \
            -H 'content-type: application/json' \
            --data '{}' > stable-sync.json
          cat stable-sync.json
          jq -e --arg version "$VERSION" '.ok == true and .version == $version' stable-sync.json >/dev/null
