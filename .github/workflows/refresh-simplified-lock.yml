name: Refresh simplified generated files

on:
  push:
    branches:
      - release/0.11-simplified

permissions:
  contents: write

concurrency:
  group: refresh-simplified-generated-files
  cancel-in-progress: true

jobs:
  generated-files:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.11-simplified
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Refresh lockfile and generated routes
        run: |
          bun install --lockfile-only
          bun install --frozen-lockfile
          bun run build
      - name: Commit generated files when needed
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- bun.lock src/routeTree.gen.ts; then
            echo "Generated files already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock src/routeTree.gen.ts
          git commit -m "chore: refresh generated files"
          git push origin HEAD:release/0.11-simplified
